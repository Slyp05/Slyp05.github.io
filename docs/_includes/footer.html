{%- comment -%}
  Overrides minima's footer: one row, the site name on the left and outside links on
  the right. Styled by .footer-row in main.scss.
{%- endcomment -%}
<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-row">
    <p class="footer-name">© 2021–{{ site.time | date: "%Y" }} <span class="p-name">{{ site.title | escape }}</span></p>

    <nav class="footer-links" aria-label="Elsewhere">
      <a href="https://assetstore.unity.com/publishers/52427">Asset Store</a>
      <a href="https://justetools.itch.io/">itch.io</a>
      <a href="https://www.youtube.com/@justetools">YouTube</a>
      <a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
    </nav>
  </div>
</footer>
