<!-- Structured data: SoftwareApplication, driven by `software:` front matter.
     No `offers` block on purpose. Google's Software App rich result needs
     name + offers.price + (aggregateRating or review); these pages carry no
     rating, so they were never eligible for it and the price was doing nothing.
     Leaving it out also means no figure here can go stale when Unity runs a
     sale or localises the price. The store stays the source of truth.

     `software.store_url` is emitted as `sameAs`, the schema.org property for a
     reference page that unambiguously identifies the same item: it ties this
     page to the Asset Store listing without asserting anything about price.
     Omitted when the field is empty, which is how an unreleased package with no
     listing yet (Settings Kit) still gets a valid block. -->
{%- if page.software -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": {{ page.software.name | default: page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Unity 6.0 or later",
  "image": {{ page.image | absolute_url | jsonify }},
  "author": {
    "@type": "Person",
    "name": "Lucas Sarkadi"
  },
  "url": {{ page.url | absolute_url | jsonify }}{% assign store_url = page.software.store_url | default: "" %}{% if store_url != "" %},
  "sameAs": {{ store_url | jsonify }}{% endif %}
}
</script>
{%- endif -%}

{%- if page.url == '/' -%}
<!-- Legacy anchors: the "About Me" and "My Stance on AI" sections moved to /about/.
     A URL fragment never reaches the server, so no server-side redirect can catch these.
     Forwarding happens here, in <head>, before the home page paints. -->
<script>
(function () {
  var moved = {
    "about-me": "about-me",
    "about": "about-me",
    "my-stance-on-ai": "my-stance-on-ai",
    "stance-on-ai": "my-stance-on-ai",
    "my-stance-about-ai": "my-stance-on-ai",
    "my-stance": "my-stance-on-ai",
    "stance": "my-stance-on-ai",
    "ai": "my-stance-on-ai"
  };
  var target = moved[decodeURIComponent(location.hash.slice(1)).toLowerCase()];
  if (target) location.replace("/about/#" + target);
})();
</script>
{%- endif -%}

<!-- Social card dimensions. jekyll-seo-tag emits og:image but not its size; giving
     platforms the dimensions lets them lay the card out before the image finishes
     downloading. Safe as constants because every og:image on the site is 1200x630
     (see the `image:` front matter and the site-wide default in _config.yml). -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:image:alt" content="{{ page.title | default: site.title | escape }}">

<!-- Theme: apply a stored choice before first paint, so there is no flash of the
     wrong colours. With nothing stored the CSS falls back to prefers-color-scheme. -->
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>

<!-- Analytics: GoatCounter (no cookies, ignores localhost automatically) -->
<script data-goatcounter="https://justetools.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
