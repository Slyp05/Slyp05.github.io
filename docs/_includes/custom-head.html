<!-- Favicons -->
<link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/images/favicon-96x96.png' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/images/site.webmanifest' | relative_url }}">

<!-- Structured data: SoftwareApplication (product rich results), driven by `software:` front matter -->
{%- if page.software -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": {{ page.software.name | default: page.title | jsonify }},
  "description": {{ page.software.description | jsonify }},
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Unity 6.0 or later",
  "image": {{ page.image | absolute_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "author": {
    "@type": "Person",
    "name": "Lucas Sarkadi"
  },
  "offers": {
    "@type": "Offer",
    "price": {{ page.software.price | jsonify }},
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock",
    "url": {{ page.software.store_url | jsonify }}
  }
}
</script>
{%- endif -%}

{%- if page.url == '/' -%}
<!-- Legacy anchors: the "About Me" and "My Stance on AI" sections moved to /about/.
     A URL fragment never reaches the server, so no server-side redirect can catch these.
     Forwarding happens here, in <head>, before the home page paints. -->
<script>
(function () {
  var moved = {
    "about-me": "about-me",
    "about": "about-me",
    "my-stance-on-ai": "my-stance-on-ai",
    "stance-on-ai": "my-stance-on-ai",
    "my-stance-about-ai": "my-stance-on-ai",
    "my-stance": "my-stance-on-ai",
    "stance": "my-stance-on-ai",
    "ai": "my-stance-on-ai"
  };
  var target = moved[decodeURIComponent(location.hash.slice(1)).toLowerCase()];
  if (target) location.replace("/about/#" + target);
})();
</script>
{%- endif -%}

<!-- Analytics: GoatCounter (no cookies, ignores localhost automatically) -->
<script data-goatcounter="https://justetools.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
