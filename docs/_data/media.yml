# Store media for each package page: the gallery under the page title
# (_includes/media-gallery.html), in the Asset Store's order: video, cover, screenshots.
#
#   source       Folder name under Sources/.
#   video        YouTube video ID. Its thumbnail is saved locally as video.webp.
#   screenshots  One entry per image, in order. `alt` is the image's headline.
#
# Images come from Sources/<source>/_Store Images & Text/Screenshot NN.png (or .jpg).
# After adding or replacing one, run `python Tools/Build-Galleries.py`: it writes
# docs/assets/media/<slug>/NN.webp and NN-thumb.webp, and the video thumbnail.

