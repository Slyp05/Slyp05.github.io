<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Understudy Store Video</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root
{
  --wall: #15171c; --wall-lt: #1f2128;
  --title: #f2f0ea; --text: #c9ccd3; --dim: #8b909b; --line: #333743;
  --card: #d9b47c; --card-ink: #2b2420; --real: #4a4e59; --real-lt: #6b707c;
  --fail: #e0525f; --pass: #7fcf86;
  --code-bg: #0e0f13; --code-text: #e4e2dc; --code-key: #c7a6f0; --code-type: #8fd3c8; --code-method: #9cc3f5; --code-num: #f5b48a;
  --shadow: 0 34px 40px -28px rgba(0, 0, 0, 0.85);
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
}
html, body { margin: 0; height: 100%; background: #0b0c0f; overflow: hidden; font-family: Bahnschrift, "Segoe UI", sans-serif; }
#viewport { position: absolute; left: 0; top: 0; }
#frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--wall); color: var(--text); }
#frame > * { position: absolute; }
svg { display: block; overflow: visible; }

.caption
{
  left: 100px; right: 100px; top: 46px; text-align: center; z-index: 20; opacity: 0; white-space: nowrap;
  font-size: 60px; font-weight: 700; font-stretch: 87.5%; color: var(--title); line-height: 1.1;
  text-shadow: 0 3px 16px rgba(0, 0, 0, 0.7);
}

/* Code cards, as on the screenshots: the test file under a cardboard bar, the code under test under the real props' grey. */
.code { background: var(--code-bg); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; border: 2px solid #262932; opacity: 0; z-index: 5; }
.code .file { display: flex; align-items: center; gap: 12px; padding: 10px 26px; background: var(--card); font-size: 26px; font-weight: 600; color: var(--card-ink); }
.code .file::before { content: ""; width: 13px; height: 13px; border-radius: 50%; background: var(--card-ink); opacity: 0.75; }
.code.real .file { background: var(--real); color: #e8e6e1; }
.code.real .file::before { background: #e8e6e1; }
.code pre { margin: 0; padding: 18px 30px 20px; font-family: var(--mono); font-size: 34px; line-height: 1.4; color: var(--code-text); white-space: pre; font-variant-ligatures: none; }
.code .k { color: var(--code-key); } .code .t { color: var(--code-type); } .code .m { color: var(--code-method); } .code .n { color: var(--code-num); }
.code .u { color: var(--card); font-weight: 700; border-radius: 6px; background: rgba(217, 180, 124, 0.14); box-shadow: 0 0 0 4px rgba(217, 180, 124, 0.14); }
/* The member the script reads, ringed in the colour of whatever plays it: grey for the real one, cardboard for the test's. */
.reads { border-radius: 6px; box-shadow: 0 0 0 4px var(--ring, transparent); }
#typed { display: inline-block; vertical-align: top; overflow: hidden; white-space: pre; }

/* The results rail, on the front edge of the stage. */
.chip
{
  top: 1014px; width: 190px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 28px; font-weight: 600; color: var(--title); background: rgba(255, 255, 255, 0.06); border: 2px solid var(--line); opacity: 0; z-index: 6;
}
.chip b { font-size: 32px; }
.chip.fail b { color: var(--fail); } .chip.pass b { color: var(--pass); }

.tag { font-size: 30px; font-weight: 600; color: var(--card-ink); background: var(--card); padding: 9px 22px; border-radius: 10px; white-space: nowrap; box-shadow: var(--shadow); }

#dim { inset: 0; background: rgba(10, 11, 14, 0.82); opacity: 0; z-index: 8; }
#pages, #leak { z-index: 9; opacity: 0; }

#end h1 { position: absolute; left: 0; right: 0; top: 118px; margin: 0; text-align: center; font-size: 170px; font-weight: 700; font-stretch: 75%; letter-spacing: 1px; color: var(--title); opacity: 0; }
#end p { position: absolute; left: 0; right: 0; top: 330px; margin: 0; text-align: center; font-size: 50px; font-stretch: 87.5%; color: #a3a8b2; opacity: 0; }
#end { inset: 0; z-index: 4; }

/* The house curtains, closed between scenes. */
.curtain { top: 0; width: 1000px; height: 1080px; z-index: 30; }
#curtainL { left: 0; } #curtainR { left: 920px; }

#controls
{
  position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: #101114; color: #c9ccd3; font: 14px "Segoe UI", sans-serif; box-sizing: border-box;
}
#controls button { background: #23262e; color: #fff; border: 1px solid #3a3e48; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
#controls input[type=range] { flex: 1; }
#time { width: 92px; font-variant-numeric: tabular-nums; }
</style>
</head>

<script>
// The score (sound.py) is in 3/4 at 120 BPM from 0 s, a bar every 1.5 s: every section and every run starts on a bar, the
// band comes in on the bar at 19.5 s, and the end title lands on the bar at 34.5 s.
const W = 1920, H = 1080, END = 39.0;
const HOOK = 0, USUAL = 10.5, CURTAIN1 = 15.0, WITH = 16.5, LEAK = 28.5, CURTAIN2 = 32.4, FINAL = 33.7;

const frame = document.getElementById('frame');
const tl = gsap.timeline({ paused: true });

// Layout reads text widths, so the timeline is built once the fonts are in.
document.fonts.ready.then(() =>
{

// Code cards sit centred at their own width.
for (const id of ['moverCard', 'testCard'])
{
  const el = document.getElementById(id);
  el.style.left = ((W - el.offsetWidth) / 2) + 'px';
}

// Captions: [start, end, text]. Each holds at least 0.3 s per word plus 1 s.
const captions = [
  [1.9, 5.2, 'This script reads the real frame time.'],
  [5.6, 9.9, 'Its test passes on one run and fails the next.'],
  [11.0, 15.0, 'Without Understudy: rewrite the script around an interface.'],
  [17.2, 20.4, 'With Understudy, one line in the test.'],
  [20.8, 23.8, 'The test now sets the frame time.'],
  [24.2, 28.1, 'Same result on every run, with the script unchanged.'],
  [28.9, 32.2, 'Miss one, and Understudy names the line.'],
];
for (const [t0, t1, txt] of captions)
{
  const el = document.createElement('div');
  el.className = 'caption';
  el.textContent = txt;
  frame.appendChild(el);
  tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, t0);
  tl.to(el, { opacity: 0, duration: 0.3 }, t1);
}

// Discrete states (a chip's result, a ring's colour): each key takes its latest state at or before the time, on every seek.
const states = new Map();
function state(key, t, apply)
{
  if (states.has(key) === false)
    states.set(key, []);
  states.get(key).push([t, apply]);
}
function applyStates(time)
{
  for (const list of states.values())
  {
    let last = null;
    for (const [t, apply] of list)
      if (t <= time)
        last = apply;
    if (last)
      last();
  }
}

// Places: the clock centre stage, the real one in the left wing in shadow, the cardboard one waiting off the right.
const CENTRE = { x: 960, y: 744 }, WING = { x: 330, y: 760 }, OFF = { x: 2150, y: 744 };
const shadeOn = () => document.getElementById('realInner').setAttribute('filter', 'url(#shade)');
const shadeOff = () => document.getElementById('realInner').setAttribute('filter', '');

// Curtains: closed at the start, and between scenes.
const CLOSED = { x: 0 }, OPEN_L = { x: -1000 }, OPEN_R = { x: 1000 };
function curtains(close, open)
{
  if (close !== null)
    tl.fromTo('#curtainL', OPEN_L, { ...CLOSED, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, close)
      .fromTo('#curtainR', OPEN_R, { ...CLOSED, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, close);
  tl.fromTo('#curtainL', CLOSED, { ...OPEN_L, duration: 0.8, ease: 'power2.inOut', immediateRender: false }, open)
    .fromTo('#curtainR', CLOSED, { ...OPEN_R, duration: 0.8, ease: 'power2.inOut', immediateRender: false }, open);
}
tl.set('#curtainL, #curtainR', CLOSED, 0);
curtains(null, 0.5);

// The real clock ticks all through, at uneven times, with a shake and its motion strokes on each tick.
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let angle = 0;
for (let t = 0.3; t < END; t += 0.22 + rand() * 0.55)
{
  tl.fromTo('#secHand', { rotation: angle, svgOrigin: '0 0' }, { rotation: angle + 6, svgOrigin: '0 0', duration: 0.06, ease: 'power3.out', immediateRender: false }, t);
  tl.fromTo('#realInner', { rotation: (rand() < 0.5) ? -1.6 : 1.6, svgOrigin: '0 118' }, { rotation: 0, svgOrigin: '0 118', duration: 0.18, ease: 'power2.out', immediateRender: false }, t);
  tl.fromTo('#ticks', { opacity: 0.9 }, { opacity: 0.25, duration: 0.25, immediateRender: false }, t);
  angle += 6;
}

// The object the script moves: three runs, each from the same start. ends: where it stops; real: moved by the real frame time.
const START_X = 380, MARK_X = 1360, CUBE_Y = 924;
tl.set('#cube', { x: START_X, y: CUBE_Y, opacity: 0 }, 0);
function runs(t0, ends, real)
{
  ends.forEach((endX, i) =>
  {
    const t = t0 + i * 1.5;
    const pass = (endX === MARK_X);
    tl.fromTo('#cube', { x: START_X, opacity: 0 }, { x: START_X, opacity: 1, duration: 0.15, immediateRender: false }, t);
    if (real)
    {
      // Uneven steps: the frame time changes from one frame to the next.
      const steps = 6;
      let x = START_X;
      for (let s = 1; s <= steps; s++)
      {
        const to = START_X + (endX - START_X) * Math.min(1, s / steps + ((s < steps) ? (rand() - 0.5) * 0.12 : 0));
        tl.fromTo('#cube', { x }, { x: to, duration: 0.15, ease: 'power1.inOut', immediateRender: false }, t + 0.15 + (s - 1) * 0.15);
        x = to;
      }
    }
    else
      tl.fromTo('#cube', { x: START_X }, { x: endX, duration: 0.9, ease: 'power1.inOut', immediateRender: false }, t + 0.15);
    const chip = document.getElementById('chip' + i);
    state('chip' + i, t0 - 0.1, () => { chip.className = 'chip'; chip.querySelector('b').textContent = ''; });
    state('chip' + i, t + 1.05, () => { chip.className = 'chip ' + ((pass) ? 'pass' : 'fail'); chip.querySelector('b').textContent = (pass) ? '✓' : '✕'; });
    tl.fromTo(chip, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t + 1.05);
    tl.to('#cube', { opacity: 0, duration: 0.15 }, t + 1.35);
  });
}

// Hook: the script reads the real frame time, played by the real clock centre stage; its test gives a new result every run.
const ring = (t, colour) => state('ring', t, () => document.getElementById('reads').style.setProperty('--ring', colour));
ring(0, 'transparent');
tl.set('#realClock', CENTRE, 0)
  .set('#cardClock', OFF, 0);
state('shade', 0, shadeOff);
tl.fromTo('#moverCard', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.5);
ring(2.4, 'rgba(139, 144, 155, 0.6)');
{
  // The link runs from the member the script reads down to the top of the clock.
  const r = document.getElementById('reads').getBoundingClientRect(), f = frame.getBoundingClientRect();
  const link = document.getElementById('link');
  link.setAttribute('x1', r.left - f.left + r.width / 2);
  link.setAttribute('y1', r.bottom - f.top + 12);
}
tl.fromTo('#link', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
runs(4.5, [1170, MARK_X, 1540], true);

// Without Understudy: the stage dims, the script is rewritten and three files are added.
tl.to('#link', { opacity: 0, duration: 0.3 }, USUAL)
  .to('#moverCard, .chip', { opacity: 0, duration: 0.3 }, USUAL)
  .fromTo('#dim', { opacity: 0 }, { opacity: 1, duration: 0.4 }, USUAL)
  .fromTo('#pages', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, USUAL + 0.2);
document.querySelectorAll('#diff .edit').forEach((el, i) =>
  tl.fromTo(el, { attr: { fill: '#5a5f6b' } }, { attr: { fill: el.dataset.to }, duration: 0.15, immediateRender: false }, USUAL + 0.8 + i * 0.18));
document.querySelectorAll('#pages .newPage').forEach((el, i) =>
  tl.fromTo(el, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, USUAL + 2.0 + i * 0.5));
// The script had to change: the red cross of screenshot 01.
tl.fromTo('#rewriteCross', { opacity: 0, scale: 0.4, svgOrigin: '380 30' }, { opacity: 1, scale: 1, svgOrigin: '380 30', duration: 0.3, ease: 'back.out(2.5)' }, USUAL + 3.6);

// Curtain. Behind it, the stage resets: the real clock centre stage again, the object and the chips cleared.
curtains(CURTAIN1, CURTAIN1 + 1.2);
tl.set('#dim, #pages', { opacity: 0 }, CURTAIN1 + 0.7)
  .set('#moverCard', { opacity: 1 }, CURTAIN1 + 0.7);

// With Understudy: one line in the test, typed. The real clock steps into the wings, still ticking; the cardboard one takes
// its place, and the ring and the link turn cardboard.
const typed = document.getElementById('typed');
const typedWidth = typed.scrollWidth;
// The card keeps its full width while the line is typed.
document.getElementById('testCard').style.width = document.getElementById('testCard').offsetWidth + 'px';
tl.fromTo('#testCard', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, WITH + 0.3)
  .fromTo(typed, { width: 0 }, { width: typedWidth, duration: 1.4, ease: 'steps(50)' }, WITH + 0.5);
// The cardboard clock is most of the way in on the bar at 19.5 s, where the full band comes in.
const SWAP = WITH + 2.0;
tl.fromTo('#realClock', CENTRE, { ...WING, duration: 1.0, ease: 'power2.inOut', immediateRender: false }, SWAP)
  .fromTo('#realClock', { scale: 1 }, { scale: 0.82, duration: 1.0, ease: 'power2.inOut', immediateRender: false }, SWAP);
state('shade', SWAP + 0.6, shadeOn);
tl.fromTo('#cardClock', OFF, { ...CENTRE, duration: 1.0, ease: 'power3.out', immediateRender: false }, SWAP + 0.5)
  .fromTo('#cardInner', { rotation: 7, svgOrigin: '0 180' }, { rotation: 0, svgOrigin: '0 180', duration: 0.9, ease: 'elastic.out(1.2, 0.4)', immediateRender: false }, SWAP + 1.3);
tl.to('#link', { opacity: 0, duration: 0.2 }, SWAP - 0.2);
ring(SWAP + 1.4, 'rgba(217, 180, 124, 0.75)');
state('linkColour', 0, () => document.getElementById('link').setAttribute('stroke', '#8b909b'));
state('linkColour', SWAP + 1.4, () => document.getElementById('link').setAttribute('stroke', '#d9b47c'));
tl.fromTo('#link', { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, SWAP + 1.4);
runs(22.5, [MARK_X, MARK_X, MARK_X], false);

// Leak detection: the stage dims under the Console's warning.
tl.to('#link, #moverCard, #testCard, .chip', { opacity: 0, duration: 0.3 }, LEAK)
  .fromTo('#dim', { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, LEAK)
  .fromTo('#leak', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, LEAK + 0.2);

// End: the curtains close and open on the cover's scene, the real clock in the wings and the cardboard one under the light,
// then the name and the tagline, and the cardboard clock takes a bow.
curtains(CURTAIN2, FINAL);
tl.set('#dim, #leak', { opacity: 0 }, CURTAIN2 + 0.7)
  .set('#mark', { opacity: 0 }, CURTAIN2 + 0.7)
  .fromTo('#end h1', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, FINAL + 0.8)
  .fromTo('#end p', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, FINAL + 1.3)
  .fromTo('#cardInner', { rotation: 0, y: 0, svgOrigin: '0 180' }, { rotation: -9, y: 8, svgOrigin: '0 180', duration: 0.45, ease: 'power2.out', yoyo: true, repeat: 1, repeatDelay: 0.25, immediateRender: false }, FINAL + 2.3);
tl.set({}, {}, END);

// A backward jump goes back to the start, then forward to its time: several tweens animate the same element across sections.
function jump(t)
{
  if (t < tl.time())
    tl.seek(0, false);
  tl.seek(t, false);
}

// Player. The soundtrack, once it exists, starts first and the timeline follows its clock, never seeking the audio.
const scrub = document.getElementById('scrub'), time = document.getElementById('time'), playBtn = document.getElementById('playBtn');
scrub.max = END;
const audio = new Audio('soundtrack.wav?' + Date.now());
audio.preload = 'auto';
let playing = false, withSound = false, runId = 0;
tl.eventCallback('onUpdate', () => { applyStates(tl.time()); scrub.value = tl.time(); time.textContent = tl.time().toFixed(2) + ' s'; });
gsap.ticker.add(() =>
{
  if (playing && withSound && (tl.paused() === false))
    tl.timeScale(1 + Math.max(-0.05, Math.min(0.05, (audio.currentTime - tl.time()) * 0.8)));
  if (playing && (tl.progress() === 1))
    stop();
});
function start(at)
{
  const id = ++runId;
  tl.pause();
  jump(at);
  playing = true;
  playBtn.textContent = 'Pause';
  const go = () =>
  {
    if (id !== runId)
      return;
    if (withSound)
      jump(audio.currentTime);
    tl.play();
  };
  audio.pause();
  audio.currentTime = at;
  audio.addEventListener('playing', () => { withSound = true; go(); }, { once: true });
  audio.play().catch(() => { withSound = false; go(); });
}
function stop()
{
  runId++;
  playing = false;
  tl.timeScale(1);
  withSound = false;
  audio.pause();
  tl.pause();
  playBtn.textContent = (tl.progress() === 1) ? 'Replay' : 'Play';
}
function toggle()
{
  if (playing)
    stop();
  else
    start((tl.progress() === 1) ? 0 : tl.time());
}
scrub.oninput = () => { stop(); jump(+scrub.value); applyStates(+scrub.value); };
playBtn.onclick = toggle;
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
for (const [name, t] of [['Hook', 0], ['Usual fix', USUAL - 0.2], ['Understudy', CURTAIN1], ['Leak', LEAK - 0.2], ['End', CURTAIN2]])
{
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => start(t);
  document.getElementById('scenes').appendChild(b);
}
const t0 = new URLSearchParams(location.search).get('t');
const bar = (t0 === null) ? 64 : 0;
function fit()
{
  const s = Math.min(innerWidth / W, (innerHeight - bar) / H);
  frame.style.transform = 'scale(' + s + ')';
  const vp = document.getElementById('viewport');
  vp.style.left = ((innerWidth - W * s) / 2) + 'px';
  vp.style.top = ((innerHeight - bar - H * s) / 2) + 'px';
}
addEventListener('resize', fit);
// Frame rendering seeks with ?t=seconds and stays paused.
window.seekTo = t => { jump(t); applyStates(t); };
if (t0 !== null)
{
  seekTo(+t0);
  document.getElementById('controls').style.display = 'none';
}
else
  seekTo(0);
fit();
});
</script>
</body>
</html>
