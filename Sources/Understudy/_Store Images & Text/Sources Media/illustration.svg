<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 1300" width="1950" height="1300">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="1" stop-color="#1f2128"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3d27"/>
      <stop offset="1" stop-color="#7a5434"/>
    </linearGradient>
    <!-- Red velvet: vertical folds, lit from the front, darker towards the outside. -->
    <pattern id="folds" width="70" height="1300" patternUnits="userSpaceOnUse">
      <rect width="70" height="1300" fill="url(#fold)"/>
    </pattern>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e0d14"/>
      <stop offset="0.35" stop-color="#9c1f2b"/>
      <stop offset="0.55" stop-color="#b8303b"/>
      <stop offset="1" stop-color="#4e0d14"/>
    </linearGradient>
    <linearGradient id="curtainShadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainShadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.03"/>
      <stop offset="0.8" stop-color="#fff3d6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Soft beam edges: a real beam has no hard outline. -->
    <filter id="beamblur" x="-10%" y="-5%" width="120%" height="110%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9bf" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffe0a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe0a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b47c"/>
      <stop offset="1" stop-color="#c49a5f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shadow on the props in the wings: darker, not see-through. -->
    <filter id="shade">
      <feComponentTransfer><feFuncR type="linear" slope="0.55"/><feFuncG type="linear" slope="0.55"/><feFuncB type="linear" slope="0.6"/></feComponentTransfer>
    </filter>
    <!-- Wavy corrugation seen on a cut cardboard edge. -->
    <pattern id="flute" width="12" height="18" patternUnits="userSpaceOnUse">
      <rect width="12" height="18" fill="#a77d47"/>
      <path d="M0 9 q3 -7 6 0 t6 0" fill="none" stroke="#8a6334" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Back wall. -->
  <rect width="1950" height="1300" fill="url(#wall)"/>

  <!-- Stage floor in perspective: boards run towards the back. -->
  <polygon points="250,800 1700,800 1950,1210 0,1210" fill="url(#floor)"/>
  <g stroke="#3e2a1a" stroke-width="3" opacity="0.7">
    <line x1="975" y1="800" x2="975" y2="1210"/>
    <line x1="815" y1="800" x2="735" y2="1210"/><line x1="1135" y1="800" x2="1215" y2="1210"/>
    <line x1="655" y1="800" x2="490" y2="1210"/><line x1="1295" y1="800" x2="1460" y2="1210"/>
    <line x1="495" y1="800" x2="245" y2="1210"/><line x1="1455" y1="800" x2="1705" y2="1210"/>
    <line x1="335" y1="800" x2="0" y2="1210"/><line x1="1615" y1="800" x2="1950" y2="1210"/>
  </g>
  <!-- Front edge of the stage. -->
  <rect x="0" y="1210" width="1950" height="90" fill="#1a120c"/>
  <rect x="0" y="1206" width="1950" height="8" fill="#94673e"/>

  <!-- Spotlight on the stand-ins. -->
  <polygon points="940,-40 1100,-40 1540,1010 420,1010" fill="url(#beam)" filter="url(#beamblur)"/>
  <ellipse cx="980" cy="1010" rx="560" ry="140" fill="url(#pool)"/>

  <!-- The real ones, set aside in the wings, in shadow. -->
  <!-- Alarm clock, still ticking. -->
  <g transform="translate(440 905)" filter="url(#shade)">
    <ellipse cx="0" cy="118" rx="95" ry="16" fill="#000" opacity="0.5"/>
    <path d="M-60 96 l-22 26 M60 96 l22 26" stroke="#2b2d33" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-62" cy="-86" r="34" fill="#b9bcc4"/><circle cx="62" cy="-86" r="34" fill="#b9bcc4"/>
    <rect x="-8" y="-128" width="16" height="30" rx="5" fill="#8f939c"/>
    <circle r="112" fill="#c8483e"/>
    <circle r="88" fill="#f3efe6"/>
    <g stroke="#2b2d33" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-74" x2="0" y2="-62"/><line x1="74" y1="0" x2="62" y2="0"/><line x1="0" y1="74" x2="0" y2="62"/><line x1="-74" y1="0" x2="-62" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="34" y2="-40" stroke="#2b2d33" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-48" y2="22" stroke="#2b2d33" stroke-width="7" stroke-linecap="round"/>
    <circle r="9" fill="#2b2d33"/>
    <g fill="none" stroke="#e8e2d4" stroke-width="7" stroke-linecap="round">
      <path d="M-150 -60 q-18 30 0 60"/><path d="M-178 -78 q-28 48 0 96"/>
      <path d="M150 -60 q18 30 0 60"/><path d="M178 -78 q28 48 0 96"/>
    </g>
  </g>

  <!-- Film camera on its tripod, recording the stage. -->
  <g transform="translate(1590 860) scale(-1 1)" filter="url(#shade)">
    <ellipse cx="0" cy="222" rx="120" ry="16" fill="#000" opacity="0.5"/>
    <path d="M0 70 L-80 220 M0 70 L80 220 M0 70 L0 224" stroke="#3a3d45" stroke-width="12" stroke-linecap="round"/>
    <rect x="-22" y="52" width="44" height="26" rx="6" fill="#3a3d45"/>
    <g stroke="#b4b9c3" stroke-width="6">
      <circle cx="-48" cy="-92" r="46" fill="#6a6f7a"/><circle cx="44" cy="-92" r="46" fill="#6a6f7a"/>
    </g>
    <circle cx="-48" cy="-92" r="15" fill="#c3c8d1"/><circle cx="44" cy="-92" r="15" fill="#c3c8d1"/>
    <rect x="-100" y="-50" width="190" height="104" rx="16" fill="#4a4e57"/>
    <rect x="90" y="-22" width="44" height="48" rx="6" fill="#3a3d45"/>
    <path d="M132 -30 L170 -44 L170 48 L132 34 Z" fill="#2e3037"/>
    <rect x="166" y="-44" width="8" height="92" rx="3" fill="#5f8fbf"/>
    <circle cx="-74" cy="-26" r="10" fill="#ff4d4d"/>
  </g>
  <!-- Its recording light, unshaded so it still reads as on. -->
  <circle cx="1664" cy="834" r="9" fill="#ff5a5a"/>
  <circle cx="1664" cy="834" r="20" fill="#ff5a5a" opacity="0.25"/>

  <!-- Side wings, framing the stage. -->
  <path d="M0 0 H230 C214 300 250 600 222 900 C214 1020 236 1120 228 1210 H0 Z" fill="url(#folds)"/>
  <path d="M0 0 H230 C214 300 250 600 222 900 C214 1020 236 1120 228 1210 H0 Z" fill="url(#curtainShadeL)"/>
  <path d="M1950 0 H1720 C1736 300 1700 600 1728 900 C1736 1020 1714 1120 1722 1210 H1950 Z" fill="url(#folds)"/>
  <path d="M1950 0 H1720 C1736 300 1700 600 1728 900 C1736 1020 1714 1120 1722 1210 H1950 Z" fill="url(#curtainShadeR)"/>

  <!-- The stand-ins: flat cardboard cutouts, painted, propped on wooden braces. -->
  <!-- Cardboard clock: its hands painted on, so it always shows the same time. -->
  <g transform="translate(790 790)">
    <ellipse cx="10" cy="228" rx="150" ry="22" fill="#000" opacity="0.45"/>
    <!-- Brace behind. -->
    <path d="M40 -40 L130 222" stroke="#8a6b47" stroke-width="20" stroke-linecap="round"/>
    <!-- Cut edge, then the face. -->
    <g transform="translate(10 8)">
      <circle cx="-62" cy="-118" r="38" fill="url(#flute)"/><circle cx="62" cy="-118" r="38" fill="url(#flute)"/>
      <circle r="140" fill="url(#flute)"/>
      <rect x="-24" y="120" width="48" height="104" fill="url(#flute)"/>
    </g>
    <rect x="-24" y="120" width="48" height="104" fill="url(#board)"/>
    <circle cx="-62" cy="-118" r="38" fill="url(#board)"/><circle cx="62" cy="-118" r="38" fill="url(#board)"/>
    <circle r="140" fill="url(#board)"/>
    <circle r="108" fill="#efe6d2"/>
    <g stroke="#2b2420" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M0 -94 l1 16 M94 2 l-16 -1 M-1 94 l1 -16 M-94 -2 l16 1"/>
      <path d="M0 2 l2 -66"/>
      <path d="M0 2 l46 2"/>
    </g>
    <circle r="10" fill="#2b2420"/>
  </g>

  <!-- Cardboard camera: its lens and reels painted on, facing the same way as the real one. -->
  <g transform="translate(1170 840) scale(-1 1)">
    <ellipse cx="0" cy="178" rx="170" ry="22" fill="#000" opacity="0.45"/>
    <path d="M-30 -20 L-130 172" stroke="#8a6b47" stroke-width="20" stroke-linecap="round"/>
    <g transform="rotate(-3)">
      <!-- Cut edge: this group is mirrored, so -10 puts it on the right on screen, like the clock's. -->
      <g transform="translate(-10 8)" fill="url(#flute)">
        <circle cx="-62" cy="-118" r="56"/><circle cx="52" cy="-118" r="56"/>
        <rect x="-130" y="-70" width="230" height="130" rx="18"/>
        <rect x="98" y="-30" width="50" height="56" rx="8"/>
        <path d="M144 -38 L190 -56 L190 52 L144 34 Z"/>
        <rect x="-20" y="56" width="40" height="110"/>
      </g>
      <rect x="-20" y="56" width="40" height="110" fill="url(#board)"/>
      <circle cx="-62" cy="-118" r="56" fill="url(#board)"/><circle cx="52" cy="-118" r="56" fill="url(#board)"/>
      <rect x="-130" y="-70" width="230" height="130" rx="18" fill="url(#board)"/>
      <rect x="98" y="-30" width="50" height="56" rx="8" fill="url(#board)"/>
      <path d="M144 -38 L190 -56 L190 52 L144 34 Z" fill="url(#board)"/>
      <g fill="none" stroke="#2b2420" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-62" cy="-118" r="34"/><circle cx="52" cy="-118" r="34"/>
        <circle cx="-62" cy="-118" r="6"/><circle cx="52" cy="-118" r="6"/>
        <rect x="-108" y="-48" width="186" height="86" rx="10"/>
        <path d="M164 -42 L164 38"/>
      </g>
      <circle cx="-84" cy="-24" r="10" fill="#2b2420"/>
      <rect x="40" y="-90" width="22" height="64" rx="3" fill="#e9e4d6" opacity="0.8" transform="rotate(30 51 -58)"/>
    </g>
  </g>

</svg>
