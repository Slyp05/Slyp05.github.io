<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: #15171c; }
  svg { display: block; }
  .title { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 700; font-stretch: 75%; letter-spacing: 1px; }
  .tagline { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 400; font-stretch: 87.5%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1300" viewBox="0 0 1950 1300">
  <!-- The stage, with the real props in the wings and the cardboard stand-ins under the spotlight. -->
  <image href="illustration.svg" x="0" y="0" width="1950" height="1300"/>

  <!-- Title and tagline, over the dark back wall. -->
  <text x="270" y="230" class="title" font-size="168" fill="#f2f0ea">Understudy</text>
  <text x="276" y="316" class="tagline" font-size="48" fill="#a3a8b2">Stop rearchitecting your game to test it.</text>
</svg>
</body>
</html>
