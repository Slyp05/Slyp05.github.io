<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Asset Store card image, 420x280. Title only. Drawn on an 840x560 canvas and rendered at half size. Rendered to PNG by render.sh (headless Chrome). -->
<style>
  html, body { margin: 0; padding: 0; background: #2140f0; }
  svg { display: block; }
  .title   { font-family: "Segoe UI Black", "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 900; }
  .tagline { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 600; }
</style>
</head>
<body>
<svg width="420" height="280" viewBox="0 0 840 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.6" cy="0.55" r="0.9">
      <stop offset="0" stop-color="#3d5cff"/>
      <stop offset="0.55" stop-color="#2140f0"/>
      <stop offset="1" stop-color="#1428b8"/>
    </radialGradient>
    <!-- Halftone: a faint grid of light dots. -->
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="840" height="560" fill="url(#bg)"/>
  <rect width="840" height="560" fill="url(#dots)" opacity="0.07"/>

  <text class="title" x="48" y="122" font-size="96" fill="#0a1344" letter-spacing="-2">CloneBuster</text>
  <text class="title" x="42" y="116" font-size="96" fill="#ffffff" letter-spacing="-2">CloneBuster</text>

  <image href="illustration-card.svg" x="30.0" y="178.4" width="780.0" height="335.1"/>
</svg>
</body>
</html>
