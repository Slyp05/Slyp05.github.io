<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Asset Store social media image, 1200x630. No text allowed. Rendered to PNG by render.sh (headless Chrome). -->
<style>
  html, body { margin: 0; padding: 0; background: #2140f0; }
  svg { display: block; }
  .title   { font-family: "Segoe UI Black", "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 900; }
  .tagline { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 600; }
</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.6" cy="0.55" r="0.9">
      <stop offset="0" stop-color="#3d5cff"/>
      <stop offset="0.55" stop-color="#2140f0"/>
      <stop offset="1" stop-color="#1428b8"/>
    </radialGradient>
    <!-- Halftone: a faint grid of light dots. -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.07"/>

  <!-- The cover illustration alone, centred. -->
  <image href="illustration.svg" x="50.0" y="86.5" width="1100.0" height="457.0"/>
</svg>
</body>
</html>
