<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .pane { background: #383838; }
  .empty { position: absolute; border: 7px dashed rgba(255, 255, 255, 0.9); border-radius: 14px; }
</style>
</head>
<body>
  <div class="head with-sub">
    <h1>Prove when each version of your game existed</h1>
    <div class="sub">However good AI gets, it can't make a copy look older than your work.</div>
  </div>
  <div class="stage">
    <div class="print pane" style="left: 150px; top: 60px; width: 580px; height: 754px">
      <div class="crop" style="position: absolute; left: 0; top: 10px; width: 580px; height: 92px"><img src="Captures/store-timeline.png" style="left: -542px; top: -170px"></div>
      <div class="crop" style="position: absolute; left: 0; top: 102px; width: 470px; height: 642px"><img src="Captures/store-timeline.png" style="left: -542px; top: -770px"></div>
      <div class="crop" style="position: absolute; left: 486px; top: 102px; width: 80px; height: 642px"><img src="Captures/store-timeline.png" style="left: -1620px; top: -770px"></div>
    </div>
    <div class="stamp" data-r="58" style="left: 730px; top: 60px"></div>

    <div class="empty" style="left: 960px; top: 70px; width: 720px; height: 540px; transform: rotate(-6deg)"></div>
    <div class="empty" style="left: 1010px; top: 150px; width: 720px; height: 540px; transform: rotate(-2deg)"></div>
    <div class="print" style="left: 1060px; top: 240px; width: 720px; height: 540px; transform: rotate(3deg)">
      <img src="Captures/copy.png" style="width: 720px">
    </div>
  </div>
  <script src="slide.js"></script>
</body>
</html>
