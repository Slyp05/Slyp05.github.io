<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .step { position: absolute; left: 150px; width: 470px; }
  .step .n { font-family: "Segoe UI Black", "Segoe UI", sans-serif; font-size: 64px; color: var(--yellow); text-shadow: 5px 5px 0 var(--ink); line-height: 1; }
  .step .t { margin-top: 10px; font-family: "Segoe UI Black", "Segoe UI", sans-serif; font-size: 52px; line-height: 1.1; text-shadow: 5px 5px 0 var(--ink); }
  .label { position: absolute; font-size: 30px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div class="head with-sub">
    <h1>No setup: every save is timestamped from import</h1>
    <div class="sub">No account, wallet or fee.</div>
  </div>
  <div class="stage">
    <div class="step" style="top: 60px"><div class="n">1</div><div class="t">Import</div></div>
    <div class="print crop" style="left: 680px; top: 70px; width: 1040px; height: 80px">
      <img src="Captures/store-first-open.png" style="left: 0; top: -152px">
    </div>
    <div class="stamp" data-r="52" style="left: 1720px; top: 70px"></div>

    <div class="step" style="top: 300px"><div class="n">2</div><div class="t">Work as usual</div></div>
    <div class="print crop" style="left: 680px; top: 290px; width: 1040px; height: 152px">
      <img src="Captures/store-inspector.png" style="left: 0; top: -52px">
    </div>

    <div class="step" style="top: 600px"><div class="n">3</div><div class="t">Export when you need it</div></div>
    <div class="print crop" style="left: 680px; top: 560px; width: 480px; height: 300px; background: #fff">
      <img src="Captures/pdf-hi-3.png" style="left: -60px; top: -50px; width: 1100px">
    </div>
    <div class="print" style="left: 1240px; top: 560px; width: 365px; height: 300px">
      <img src="Captures/reel-009.png" style="width: 365px">
    </div>
  </div>
  <script src="slide.js"></script>
</body>
</html>
