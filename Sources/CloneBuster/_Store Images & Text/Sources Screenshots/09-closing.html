<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .list { position: absolute; left: 260px; top: 200px; width: 1500px; }
  .item { position: relative; padding-left: 120px; margin-bottom: 52px; font-size: 52px; font-weight: 700; line-height: 1.2; text-shadow: 4px 4px 0 var(--ink); }
  .item .stamp { left: 44px; top: 32px; }
  .item small { display: block; margin-top: 6px; font-size: 34px; font-weight: 600; color: var(--yellow); text-shadow: none; }
</style>
</head>
<body>
  <div class="head">
    <h1>Editor only: nothing added to your build</h1>
  </div>
  <div class="stage">
    <div class="list">
      <div class="item"><div class="stamp" data-r="34" data-rot="-20"></div>Only hashes leave your computer</div>
      <div class="item"><div class="stamp" data-r="34" data-rot="40"></div>Purchased assets are kept out of every proof</div>
      <div class="item"><div class="stamp" data-r="34" data-rot="30"></div>Your repository backs it up</div>
      <div class="item"><div class="stamp" data-r="34" data-rot="-5"></div>Source code and full documentation included</div>
      <div class="item"><div class="stamp" data-r="34" data-rot="15"></div>Unity 6.0 or newer</div>
    </div>
  </div>
  <script src="slide.js"></script>
</body>
</html>
