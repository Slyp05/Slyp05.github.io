<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <!-- The cover's cream paper at the slide page size. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#fcf9f3"/>
      <stop offset="0.6" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e6dbc8"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.6" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 1.4 -0.6"/>
    </filter>
  </defs>
  <rect width="1920" height="1280" fill="url(#bg)"/>
  <rect width="1920" height="1280" filter="url(#grain)" opacity="0.09"/>
</svg>
