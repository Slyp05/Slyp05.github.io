<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Asset Store cover image, 1950x1300. Rendered to PNG by render.sh (headless Chrome). -->
<style>
  html, body { margin: 0; padding: 0; background: #f4eee3; }
  svg { display: block; }
  .title   { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 700; }
  .tagline { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 400; }
</style>
</head>
<body>
<svg width="1950" height="1300" viewBox="0 0 1950 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.76" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#fcf9f3"/>
      <stop offset="0.55" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e6dbc8"/>
    </radialGradient>
    <!-- Paper grain: fine, faint fibres. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.6" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 1.4 -0.6"/>
    </filter>
  </defs>

  <rect width="1950" height="1300" fill="url(#bg)"/>
  <rect width="1950" height="1300" filter="url(#grain)" opacity="0.10"/>

  <!-- Text block: title and tagline only, per Asset Store cover rules. -->
  <text class="title" x="112" y="600" font-size="150" fill="#221d2b" letter-spacing="-3">Concordance</text>
  <text class="tagline" x="120" y="700" font-size="56" fill="#4a4256">Coordinate the scripts</text>
  <text class="tagline" x="120" y="772" font-size="56" fill="#4a4256">that write the same value.</text>

  <image href="illustration.svg" x="1090" y="266" width="800" height="767"/>
</svg>
</body>
</html>
