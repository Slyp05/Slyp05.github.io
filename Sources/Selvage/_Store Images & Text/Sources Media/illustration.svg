<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="940 220 960 800">
  <!-- The provider list threading into a context's members. Shared by the cover and the social image,
       which place it with <image>. Coordinates are the cover's own (1950x1300 canvas). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Threads from the provider list to the context's members. Each thread has a dark casing so
       crossings read as over/under, like woven fabric. Drawn back to front. -->
  <g fill="none" stroke-linecap="round">
    <!-- provider 3 (peach) -> member 1 -->
    <path d="M1240 890 C1360 890, 1360 600, 1478 600" stroke="#142440" stroke-width="26"/>
    <path d="M1240 890 C1360 890, 1360 600, 1478 600" stroke="#fab387" stroke-width="12"/>
    <!-- provider 0 (blue) -> member 2 -->
    <path d="M1240 320 C1360 320, 1360 730, 1478 730" stroke="#142440" stroke-width="26"/>
    <path d="M1240 320 C1360 320, 1360 730, 1478 730" stroke="#89b4fa" stroke-width="12"/>
    <!-- provider 2 (teal) -> member 3 -->
    <path d="M1240 700 C1360 700, 1360 860, 1478 860" stroke="#142440" stroke-width="26"/>
    <path d="M1240 700 C1360 700, 1360 860, 1478 860" stroke="#94e2d5" stroke-width="12"/>
    <!-- provider 1 (mauve) -> member 0 -->
    <path d="M1240 510 C1360 510, 1360 470, 1478 470" stroke="#142440" stroke-width="26"/>
    <path d="M1240 510 C1360 510, 1360 470, 1478 470" stroke="#cba6f7" stroke-width="12"/>
  </g>

  <!-- Provider list: four ordered entries with abstract glyphs. -->
  <g filter="url(#shadow)">
    <rect x="1010" y="260" width="230" height="120" rx="24" fill="#1b2c4b" stroke="#89b4fa" stroke-width="4"/>
    <rect x="1010" y="450" width="230" height="120" rx="24" fill="#1b2c4b" stroke="#cba6f7" stroke-width="4"/>
    <rect x="1010" y="640" width="230" height="120" rx="24" fill="#1b2c4b" stroke="#94e2d5" stroke-width="4"/>
    <rect x="1010" y="830" width="230" height="120" rx="24" fill="#1b2c4b" stroke="#fab387" stroke-width="4"/>
  </g>
  <!-- Order index pips. -->
  <g fill="#7d93b8">
    <circle cx="975" cy="320" r="7"/>
    <circle cx="975" cy="510" r="7"/>
    <circle cx="975" cy="700" r="7"/>
    <circle cx="975" cy="890" r="7"/>
  </g>
  <path d="M975 335 V495 M975 525 V685 M975 715 V875" stroke="#7d93b8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- Glyph: scene cube. -->
  <g transform="translate(1062 320)" fill="none" stroke="#89b4fa" stroke-width="5" stroke-linejoin="round">
    <path d="M0 -30 L28 -15 L28 17 L0 32 L-28 17 L-28 -15 Z"/>
    <path d="M-28 -15 L0 0 L28 -15 M0 0 V32"/>
  </g>
  <rect x="1118" y="306" width="90" height="12" rx="6" fill="#89b4fa" opacity="0.55"/>
  <rect x="1118" y="328" width="58" height="10" rx="5" fill="#6c7086"/>

  <!-- Glyph: attribute brackets. -->
  <g transform="translate(1062 510)" fill="none" stroke="#cba6f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-12 -28 H-26 V28 H-12"/>
    <path d="M12 -28 H26 V28 H12"/>
    <circle cx="0" cy="0" r="5" fill="#cba6f7" stroke="none"/>
  </g>
  <rect x="1118" y="496" width="76" height="12" rx="6" fill="#cba6f7" opacity="0.55"/>
  <rect x="1118" y="518" width="66" height="10" rx="5" fill="#6c7086"/>

  <!-- Glyph: registry stack. -->
  <g transform="translate(1062 700)" fill="none" stroke="#94e2d5" stroke-width="5" stroke-linejoin="round">
    <path d="M-28 -12 L0 -26 L28 -12 L0 2 Z"/>
    <path d="M-28 4 L0 18 L28 4"/>
    <path d="M-28 18 L0 32 L28 18" opacity="0.6"/>
  </g>
  <rect x="1118" y="686" width="96" height="12" rx="6" fill="#94e2d5" opacity="0.55"/>
  <rect x="1118" y="708" width="50" height="10" rx="5" fill="#6c7086"/>

  <!-- Glyph: asset grid. -->
  <g transform="translate(1062 890)" fill="#fab387">
    <rect x="-28" y="-28" width="24" height="24" rx="6"/>
    <rect x="4" y="-28" width="24" height="24" rx="6" opacity="0.6"/>
    <rect x="-28" y="4" width="24" height="24" rx="6" opacity="0.6"/>
    <rect x="4" y="4" width="24" height="24" rx="6"/>
  </g>
  <rect x="1118" y="876" width="70" height="12" rx="6" fill="#fab387" opacity="0.55"/>
  <rect x="1118" y="898" width="62" height="10" rx="5" fill="#6c7086"/>

  <!-- Context: an abstract component card with four injected members. -->
  <g filter="url(#shadow)">
    <rect x="1478" y="300" width="380" height="630" rx="32" fill="#1d3052" stroke="#3d5378" stroke-width="3"/>
  </g>
  <path d="M1478 400 H1858" stroke="#3d5378" stroke-width="3"/>
  <g transform="translate(1530 350)" fill="none" stroke="#b4befe" stroke-width="5" stroke-linejoin="round">
    <path d="M0 -22 L19 -11 L19 11 L0 22 L-19 11 L-19 -11 Z"/>
    <circle cx="0" cy="0" r="6" fill="#b4befe" stroke="none"/>
  </g>
  <rect x="1572" y="340" width="150" height="18" rx="9" fill="#cdd6f4" opacity="0.8"/>

  <!-- Member rows: socket, value bar, validation dot. -->
  <g>
    <rect x="1505" y="438" width="326" height="64" rx="16" fill="#26395c"/>
    <rect x="1530" y="460" width="120" height="20" rx="10" fill="#cba6f7" opacity="0.7"/>
    <rect x="1664" y="462" width="70" height="16" rx="8" fill="#6c7086"/>
    <circle cx="1798" cy="470" r="13" fill="#a6e3a1" filter="url(#glow)"/>

    <rect x="1505" y="568" width="326" height="64" rx="16" fill="#26395c"/>
    <rect x="1530" y="590" width="96" height="20" rx="10" fill="#fab387" opacity="0.7"/>
    <rect x="1640" y="592" width="96" height="16" rx="8" fill="#6c7086"/>
    <circle cx="1798" cy="600" r="13" fill="#a6e3a1" filter="url(#glow)"/>

    <rect x="1505" y="698" width="326" height="64" rx="16" fill="#26395c"/>
    <rect x="1530" y="720" width="136" height="20" rx="10" fill="#89b4fa" opacity="0.7"/>
    <rect x="1680" y="722" width="54" height="16" rx="8" fill="#6c7086"/>
    <circle cx="1798" cy="730" r="13" fill="#a6e3a1" filter="url(#glow)"/>

    <rect x="1505" y="828" width="326" height="64" rx="16" fill="#26395c"/>
    <rect x="1530" y="850" width="110" height="20" rx="10" fill="#94e2d5" opacity="0.7"/>
    <rect x="1654" y="852" width="80" height="16" rx="8" fill="#6c7086"/>
    <circle cx="1798" cy="860" r="13" fill="#a6e3a1" filter="url(#glow)"/>
  </g>

  <!-- Sockets on the card edge, where each thread lands. -->
  <g stroke="#1d3052" stroke-width="5">
    <circle cx="1478" cy="470" r="15" fill="#cba6f7"/>
    <circle cx="1478" cy="600" r="15" fill="#fab387"/>
    <circle cx="1478" cy="730" r="15" fill="#89b4fa"/>
    <circle cx="1478" cy="860" r="15" fill="#94e2d5"/>
  </g>
</svg>
