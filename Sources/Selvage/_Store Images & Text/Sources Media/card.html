<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Asset Store card image, 420x280. Text allowed: title and publisher only. Drawn on an 840x560
     canvas and rendered at half size by render.sh. -->
<style>
  html, body { margin: 0; padding: 0; background: #14223d; }
  svg { display: block; }
  .title { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-weight: 700; }
</style>
</head>
<body>
<svg width="420" height="280" viewBox="0 0 840 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Indigo, lighter where the fabric is worn at the centre, deep at the edges. -->
    <radialGradient id="bg" cx="0.7" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#34557f"/>
      <stop offset="0.5" stop-color="#22395e"/>
      <stop offset="1" stop-color="#121e36"/>
    </radialGradient>
    <!-- 3x1 twill: the diagonal ribs of denim. -->
    <pattern id="twill" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
      <rect width="18" height="6" fill="#9fb6d6"/>
    </pattern>
    <!-- Slub and fade: irregular light flecks of the white weft showing through. -->
    <filter id="heather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5 0.14" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 1.6 -0.9"/>
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="1" stop-color="#d6e2f5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="840" height="560" fill="url(#bg)"/>
  <rect width="840" height="560" fill="url(#twill)" opacity="0.10"/>
  <rect width="840" height="560" filter="url(#heather)" opacity="0.12"/>

  <!-- One grid: everything centres on y 257 (the middle of the fabric above the hem), with 44 px margins left
       and right. Providers sit at x 490-570, y 152 / 257 / 362; the context card spans 102-412 with its header band
       102-152 and three member rows centred at 195 / 282 / 369. -->
  <text class="title" x="40" y="294" font-size="104" fill="url(#titleGrad)" letter-spacing="-2">Selvage</text>

  <!-- The cover's illustration reduced to three providers and three members, with thicker strokes
       so it stays legible at card size. -->
  <g fill="none" stroke-linecap="round">
    <path d="M570 362 C623 362, 623 195, 676 195" stroke="#142440" stroke-width="22"/>
    <path d="M570 362 C623 362, 623 195, 676 195" stroke="#fab387" stroke-width="10"/>
    <path d="M570 152 C623 152, 623 282, 676 282" stroke="#142440" stroke-width="22"/>
    <path d="M570 152 C623 152, 623 282, 676 282" stroke="#89b4fa" stroke-width="10"/>
    <path d="M570 257 C623 257, 623 369, 676 369" stroke="#142440" stroke-width="22"/>
    <path d="M570 257 C623 257, 623 369, 676 369" stroke="#cba6f7" stroke-width="10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="117" width="80" height="70" rx="16" fill="#1b2c4b" stroke="#89b4fa" stroke-width="4"/>
    <rect x="490" y="222" width="80" height="70" rx="16" fill="#1b2c4b" stroke="#cba6f7" stroke-width="4"/>
    <rect x="490" y="327" width="80" height="70" rx="16" fill="#1b2c4b" stroke="#fab387" stroke-width="4"/>
    <rect x="676" y="102" width="120" height="310" rx="20" fill="#1d3052" stroke="#3d5378" stroke-width="3"/>
  </g>

  <!-- Glyphs: scene cube, attribute brackets, asset grid, each centred in its box. -->
  <g transform="translate(530 152)" fill="none" stroke="#89b4fa" stroke-width="5" stroke-linejoin="round">
    <path d="M0 -21 L19 -10.5 L19 10.5 L0 21 L-19 10.5 L-19 -10.5 Z"/>
    <path d="M-19 -10.5 L0 0 L19 -10.5 M0 0 V21"/>
  </g>
  <g transform="translate(530 257)" fill="none" stroke="#cba6f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8 -20 H-18 V20 H-8"/>
    <path d="M8 -20 H18 V20 H8"/>
    <circle cx="0" cy="0" r="4" fill="#cba6f7" stroke="none"/>
  </g>
  <g transform="translate(530 362)" fill="#fab387">
    <rect x="-20" y="-20" width="17" height="17" rx="4"/>
    <rect x="3" y="-20" width="17" height="17" rx="4" opacity="0.6"/>
    <rect x="-20" y="3" width="17" height="17" rx="4" opacity="0.6"/>
    <rect x="3" y="3" width="17" height="17" rx="4"/>
  </g>

  <!-- Context card: header and three members, each lit Green. -->
  <path d="M676 152 H796" stroke="#3d5378" stroke-width="3"/>
  <rect x="694" y="122" width="62" height="10" rx="5" fill="#cdd6f4" opacity="0.8"/>
  <g>
    <rect x="690" y="168" width="92" height="54" rx="12" fill="#26395c"/>
    <rect x="702" y="188" width="40" height="14" rx="7" fill="#fab387" opacity="0.7"/>
    <circle cx="764" cy="195" r="9" fill="#a6e3a1" filter="url(#glow)"/>
    <rect x="690" y="255" width="92" height="54" rx="12" fill="#26395c"/>
    <rect x="702" y="275" width="40" height="14" rx="7" fill="#89b4fa" opacity="0.7"/>
    <circle cx="764" cy="282" r="9" fill="#a6e3a1" filter="url(#glow)"/>
    <rect x="690" y="342" width="92" height="54" rx="12" fill="#26395c"/>
    <rect x="702" y="362" width="40" height="14" rx="7" fill="#cba6f7" opacity="0.7"/>
    <circle cx="764" cy="369" r="9" fill="#a6e3a1" filter="url(#glow)"/>
  </g>
  <g stroke="#1d3052" stroke-width="4">
    <circle cx="676" cy="195" r="11" fill="#fab387"/>
    <circle cx="676" cy="282" r="11" fill="#89b4fa"/>
    <circle cx="676" cy="369" r="11" fill="#cba6f7"/>
  </g>

  <image href="selvage.svg" x="0" y="515" width="840" height="45"/>
</svg>
</body>
</html>
