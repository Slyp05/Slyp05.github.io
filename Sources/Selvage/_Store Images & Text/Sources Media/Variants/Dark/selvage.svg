<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="104" viewBox="0 1196 1950 104">
  <!-- Selvage: the finished edge of the fabric the image is woven from. A tight-weave strip closed by
       stitching, with tenter pinholes. Every image places it along its bottom edge with <image>, scaled
       to the image width (height = width * 104 / 1950). -->
  <defs>
    <pattern id="tightWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#1b1b2a"/>
      <rect x="1" y="2" width="6" height="4" rx="2" fill="#3b3b55"/>
      <rect x="10" y="1" width="4" height="6" rx="2" fill="#2e2e45"/>
      <rect x="2" y="9" width="4" height="6" rx="2" fill="#2e2e45"/>
      <rect x="9" y="10" width="6" height="4" rx="2" fill="#3b3b55"/>
    </pattern>
    <pattern id="pinholes" x="2" y="1270" width="56" height="12" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="6" r="4.5" fill="#0e0e16"/>
    </pattern>
  </defs>
  <rect x="0" y="1196" width="1950" height="104" fill="url(#tightWeave)"/>
  <path d="M0 1196 H1950" stroke="#45475a" stroke-width="2"/>
  <path d="M0 1208 H1950" stroke="#6c7086" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
  <path d="M0 1298 H1950" stroke="#11111b" stroke-width="4"/>
  <rect x="0" y="1270" width="1950" height="12" fill="url(#pinholes)"/>
</svg>
