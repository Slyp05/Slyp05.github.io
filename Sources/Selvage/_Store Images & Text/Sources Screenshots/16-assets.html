<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .stage { display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .code { align-self: flex-start; padding: 24px 36px; }
  .code pre { font-size: 30px; }
  .rows { display: flex; flex-direction: column; gap: 14px; }
  .r { display: grid; grid-template-columns: 420px 1fr; align-items: center; box-sizing: border-box; height: 92px; padding: 0 30px; border-radius: 14px; border: 2px solid var(--border); background: rgba(20, 34, 62, 0.92); }
  .r .where { display: flex; align-items: center; gap: 16px; font-size: 29px; font-weight: 600; color: var(--ink); }
  .r .where::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--asset); flex: none; }
  .r .how { font-size: 27px; color: var(--muted); }
  .r .how code { font-family: "Cascadia Code", Consolas, monospace; color: var(--ink); font-size: 0.9em; }
</style>
</head>
<body>
<div class="head">
  <h1>Assets, loaded the right way</h1>
  <p>The same member, wherever the asset lives. Nothing extra to write.</p>
</div>
<div class="stage">
  <div class="code"><pre class="cs">[Inject] GameSettings settings;</pre></div>
  <div class="rows">
    <div class="r"><span class="where">Any folder</span><span class="how">Referenced by the build, ready when the game starts</span></div>
    <div class="r"><span class="where">Resources</span><span class="how">Loaded with <code>Resources.Load</code> when first needed</span></div>
    <div class="r"><span class="where">Addressables</span><span class="how">Loaded asynchronously when first needed</span></div>
  </div>
</div>
<img class="hem" src="selvage.svg">
<script src="highlight.js"></script>
</body>
</html>
