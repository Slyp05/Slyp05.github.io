<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .stage { display: flex; flex-direction: column; justify-content: center; gap: 56px; }
  .code { align-self: flex-start; padding: 24px 36px; }
  .code pre { font-size: 30px; }
  .flow { display: flex; align-items: center; gap: 28px; }
  .moment { display: flex; flex-direction: column; gap: 14px; }
  .moment .when { font-size: 26px; color: var(--muted); }
  .moment .when b { color: var(--ink); font-weight: 600; }
  .val { width: 420px; height: 86px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; padding: 0 28px; font-size: 32px; font-weight: 600; }
  .val.ready { background: rgba(148, 226, 213, 0.16); border: 2px solid var(--teal); color: var(--teal); }
  .val.loading { border: 3px dashed #5d7196; color: var(--dim); font-weight: 400; }
  .val.best { background: rgba(137, 180, 250, 0.16); border: 2px solid var(--blue); color: var(--blue); }
</style>
</head>
<body>
<div class="head">
  <h1>Ready now, better when it arrives</h1>
  <p>A member marked Warm takes what is ready now, while the slower one is prepared. No async code needed.</p>
</div>
<div class="stage">
  <div class="code">
<pre class="cs">[Inject(Warm = true)] SaveData save;</pre>
  </div>
  <div class="flow">
    <div class="moment"><div class="when"><b>At once</b></div><div class="val ready">Save on this device</div></div>
    <svg width="56" height="56" viewBox="0 0 64 64"><path d="M10 32 H50 M36 16 L52 32 L36 48" fill="none" stroke="#89b4fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="moment"><div class="when">In the background</div><div class="val loading">Cloud save loading</div></div>
    <svg width="56" height="56" viewBox="0 0 64 64"><path d="M10 32 H50 M36 16 L52 32 L36 48" fill="none" stroke="#89b4fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="moment"><div class="when"><b>On the next reinject</b></div><div class="val best">Cloud save</div></div>
  </div>
</div>
<img class="hem" src="selvage.svg">
<script src="highlight.js"></script>
</body>
</html>
