<svg width="1920" height="1280" viewBox="0 0 1920 1280" xmlns="http://www.w3.org/2000/svg">
  <!-- The cover's denim, drawn at the screenshots' own 1920x1280 page size. -->
  <defs>
    <radialGradient id="bg" cx="0.55" cy="0.42" r="0.95">
      <stop offset="0" stop-color="#34557f"/>
      <stop offset="0.5" stop-color="#22395e"/>
      <stop offset="1" stop-color="#121e36"/>
    </radialGradient>
    <pattern id="twill" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
      <rect width="14" height="5" fill="#9fb6d6"/>
    </pattern>
    <filter id="heather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.1" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 1.6 -0.9"/>
    </filter>
  </defs>
  <rect width="1920" height="1280" fill="url(#bg)"/>
  <rect width="1920" height="1280" fill="url(#twill)" opacity="0.10"/>
  <rect width="1920" height="1280" filter="url(#heather)" opacity="0.16"/>
</svg>
