<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .stage { top: 290px; display: flex; align-items: center; justify-content: space-between; }
  .main { position: relative; width: 1060px; }
  .main .shot { width: 1060px; }
  .right { width: 560px; display: flex; flex-direction: column; gap: 30px; }
  .right .crop { width: 560px; }
</style>
</head>
<body>
<div class="head">
  <h1>Every result comes with its reason</h1>
  <p>One click lists every provider in the order Selvage asks them, and shows which one answers.</p>
</div>
<div class="stage">
  <div class="main">
    <img class="shot" src="Captures/validation-explain.png">
    <div class="ring green" style="left: 22px; top: 418px; width: 1004px; height: 24px;"></div>
  </div>
  <div class="right">
    <div class="cap">The provider that supplies the field is <b>highlighted</b>. The ones below it are not asked.</div>
    <img class="crop" src="Captures/explain-missing.png">
    <div class="cap">A missing field lists <b>every provider it asked</b>.</div>
  </div>
</div>
<img class="hem" src="selvage.svg">
</body>
</html>
